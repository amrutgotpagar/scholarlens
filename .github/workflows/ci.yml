name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    needs: [backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (not pushed — verifies the Dockerfile builds clean)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: rag-arxiv-qa-backend:ci

  # Deploys to the AWS stack in infra/ (ECS Fargate + ECR + S3/CloudFront). That stack is
  # portfolio Terraform that has never been `apply`'d — see infra/README or the PR that
  # introduced it — so AWS_DEPLOY_ENABLED is never set to "true" in this repo's variables.
  # The job is fully wired (this is the deliverable for Phase 6 of the project spec) but
  # structurally cannot run — and therefore cannot rack up any AWS cost — until someone
  # deliberately applies the Terraform and flips that repo variable on. The site actually
  # serving users today is Vercel (frontend) + Render (backend), deployed by those
  # platforms' own git integrations, not by this workflow.
  deploy-aws:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: [backend-test, frontend-build, docker-build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME }}
      ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push backend image
        working-directory: backend
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        id: build

      - name: Update ECS service with the new image
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "${{ steps.build.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test the deployed health endpoint
        run: curl --fail --retry 5 --retry-delay 10 "http://${ALB_DNS_NAME}/api/health"

      - name: Deploy frontend to S3 and invalidate CloudFront
        working-directory: frontend
        run: |
          npm ci
          npm run build
          aws s3 sync dist "s3://${FRONTEND_BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
